name: Resuelvo CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Syntax checks
        run: |
          node --check server.js
          node --check marketplace.js
          node --check scripts/test-retention.js
      - name: Marketplace tests
        run: npm test
      - name: Production dependency audit
        run: npm audit --omit=dev
      - name: Build production container
        run: docker build --tag resuelvo-espana:ci .
